# Pipeline del paso 6: despliega solo la app en la EC2
name: Deploy app to EC2

# Se lanza a mano desde la pestaña Actions (botón "Run workflow")
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Se conecta por SSH a la EC2 y ejecuta los comandos de "script" allá
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}          # IP pública de la EC2
          username: ${{ secrets.EC2_USER }}      # ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}        # llave privada de despliegue
          script: |
            cd ~/lab-observabilidad-monitoreo    # carpeta del proyecto en la EC2
            git pull                             # trae el código más reciente
            docker compose up -d --build app     # reconstruye y levanta solo la app
