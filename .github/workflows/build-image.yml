# Nombre que aparece en la pestaña Actions de GitHub
name: Build and push Docker image

# Cuándo se dispara
on:
  push:
    branches: [main]        # solo al hacer push a main
    paths:
      - 'app/**'            # y solo si cambió algo dentro de app/

# Permisos del GITHUB_TOKEN que GitHub crea en cada ejecución
permissions:
  contents: read            # leer el código del repo
  packages: write           # publicar la imagen en GitHub Packages

jobs:
  build-and-push:
    runs-on: ubuntu-latest  # máquina virtual que GitHub presta para el job

    steps:
      # 1. Descargar el código del repo en la máquina del job
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Iniciar sesión en el registro de GitHub (ghcr.io)
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # token automatico

      # 3. Construir la imagen desde app/ y subirla con la etiqueta latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./app    # carpeta donde está el Dockerfile
          push: true
          tags: ghcr.io/jcontrerasa9/lab-observabilidad-monitoreo:latest
