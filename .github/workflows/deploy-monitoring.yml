# Pipeline del paso 7: despliega Prometheus y Grafana en la EC2
name: Deploy monitoring to EC2

# Se dispara solo al hacer push a main que modifique monitoring/
on:
  push:
    branches: [main]
    paths:
      - 'monitoring/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/lab-observabilidad-monitoreo
            git pull
            docker compose up -d --force-recreate prometheus grafana
